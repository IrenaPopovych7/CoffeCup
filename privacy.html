<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef2e7"><title>Privacy Policy | My Cup</title><style>:root{font-family:system-ui,-apple-system,sans-serif;background:#f7f6ee;color:#243d2c}*{box-sizing:border-box}body{margin:0}main{max-width:710px;margin:auto;padding:28px 18px 70px;line-height:1.65}h1{font-size:2rem;margin-bottom:4px}h2{font-size:1.1rem;margin-top:28px}.card{background:white;border-radius:20px;padding:24px}a{color:#346645}button{padding:8px 14px;border:1px solid #b4cbb3;border-radius:10px;background:#f0f6ed;color:#25482d;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}small{color:#637966}li{margin:5px 0}</style></head><body><main><div class="top"><a href="./" id="back">← Back to My Cup</a><div><button id="en">EN</button> <button id="uk">УКР</button></div></div><div class="card"><h1 id="title">Privacy Policy</h1><small id="updated">Updated: 9 November 2026</small><div id="content"></div></div></main><script>
const content={
en:{title:"Privacy Policy",updated:"Updated: 9 November 2026",back:"← Back to My Cup",body:`<h2>About My Cup</h2><p>My Cup is a free, static caffeine tracking website published at GitHub Pages. It is a personal tracking tool, not a medical device or healthcare service.</p>
<h2>Information stored on your device</h2><p>The app stores the drinks you enter, dates and times, estimated caffeine amounts, custom daily caffeine goal, and selected language in your browser's localStorage. We do not provide user accounts, a server-side database, or cloud sync for these entries.</p>
<h2>Data we receive</h2><p>The developer does not receive your beverage diary or personalised goal when you use the app normally. There is no analytics, advertising tracker, or contact form in this version. GitHub Pages, our hosting provider, logs visitors' IP addresses for security purposes and may process technical data under its own privacy statement.</p>
<h2>Purpose and retention</h2><p>Local data are used solely to show your diary, calculations and settings. They remain in your browser until you delete entries, clear the site's browser data, or your browser removes them. Storage is specific to the browser and device. Avoid using shared devices for private records.</p>
<h2>Your choices</h2><ul><li>Delete individual drink entries or all entries for a selected day in the app.</li><li>Clear this site's browser storage to remove the locally stored diary, language and goal.</li><li>Do not enter sensitive personal information in custom drink names.</li></ul>
<h2>Other services</h2><p>The app is hosted on GitHub Pages. Review <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">GitHub's Privacy Statement</a>. No third-party analytics or ad scripts are intentionally included.</p>
<h2>Health note</h2><p>Caffeine figures are approximate. The default 200 mg/day setting is a general guideline, not individual medical advice. Editing the limit does not establish safety. Seek advice from a qualified clinician for pregnancy, fertility treatment or specific medical conditions.</p>
<h2>Contact and changes</h2><p>For questions or privacy requests about this project, <a href="https://github.com/IrenaPopovych7/CoffeCup/issues">open an issue in the project repository</a>. Please do not post personal or health information publicly. This policy may change as new features are added.</p>`},
uk:{title:"Політика конфіденційності",updated:"Оновлено: 9 листопада 2026 року",back:"← Назад до Моєї чашки",body:`<h2>Про застосунок</h2><p>«Моя чашка» — безкоштовний статичний сайт для обліку кофеїну на GitHub Pages. Це інструмент самостійного відстеження, а не медичний виріб чи медична послуга.</p>
<h2>Дані на твоєму пристрої</h2><p>У localStorage браузера зберігаються введені напої, дати й час, орієнтовна кількість кофеїну, власний денний ліміт та мова інтерфейсу. У цій версії немає облікових записів, серверної бази даних або хмарної синхронізації.</p>
<h2>Які дані ми отримуємо</h2><p>Розробник не отримує історію напоїв або персональний ліміт за звичайного використання. У цій версії немає аналітики, рекламних трекерів чи форми зворотного зв'язку. Хостинг GitHub Pages реєструє IP-адреси відвідувачів із міркувань безпеки та може обробляти технічні дані згідно зі своєю політикою.</p>
<h2>Мета та строки зберігання</h2><p>Локальні записи потрібні лише для відображення історії, розрахунків та налаштувань. Дані залишаються у браузері, доки ти їх не видалиш, не очистиш дані сайту або браузер не видалить їх сам. Сховище прив'язане до браузера й пристрою; уникай приватних записів на спільних пристроях.</p>
<h2>Твій контроль</h2><ul><li>Можна видаляти окремі записи або всі записи вибраного дня.</li><li>Очищення даних сайту в браузері видаляє локальну історію, мову та ліміт.</li><li>Не вводь чутливу особисту інформацію в назвах напоїв.</li></ul>
<h2>Сторонні сервіси</h2><p>Сайт розміщений на GitHub Pages. Дивись <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">політику конфіденційності GitHub</a>. Ми свідомо не додавали сторонню аналітику або рекламні скрипти.</p>
<h2>Застереження щодо здоров'я</h2><p>Кількість кофеїну орієнтовна. Початкове значення 200 мг/день — загальний орієнтир, а не персональна порада лікаря. Зміна ліміту не підтверджує його безпечність. Під час вагітності, лікування безпліддя або за інших медичних обставин звертайся до лікаря.</p>
<h2>Контакти та зміни</h2><p>Для питань про проєкт або приватність <a href="https://github.com/IrenaPopovych7/CoffeCup/issues">створи issue в репозиторії</a>. Не публікуй там особисті або медичні дані. Політика може змінюватися з розвитком застосунку.</p>`}};
function choose(lang){const t=content[lang];document.documentElement.lang=lang;document.title=t.title+' | My Cup';for(const k of ['title','updated','back'])document.getElementById(k).textContent=t[k];document.getElementById('content').innerHTML=t.body;document.getElementById('en').setAttribute('aria-pressed',String(lang==='en'));document.getElementById('uk').setAttribute('aria-pressed',String(lang==='uk'));try{localStorage.setItem('my-cup-language',lang)}catch(e){}}
document.getElementById('en').onclick=()=>choose('en');document.getElementById('uk').onclick=()=>choose('uk');let lang=new URLSearchParams(location.search).get('lang');if(lang!=='en'&&lang!=='uk'){try{lang=localStorage.getItem('my-cup-language')}catch(e){}}choose(lang==='uk'?'uk':'en');
</script></body></html>
